spring.application.name: core-api
spring.profiles.active: test

logging:
  level:
    root: INFO
    io.jonghyun.boilerplate: DEBUG

spring:
  web.resources.add-mappings: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        default_batch_fetch_size: 100

storage:
  datasource:
    core:
      driver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:postgresql://localhost:5432/coredb
      username: postgres
      password: postgres
      maximum-pool-size: 5
      connection-timeout: 1100
      keepalive-time: 30000
      validation-timeout: 1000
      max-lifetime: 600000
      pool-name: test-db-pool
      data-source-properties:
        socketTimeout: 3000

jwt:
  secret: test-secret-key-for-unit-and-integration-tests-must-be-at-least-256-bits-long
  access-token-validity: 3600000

example:
  api:
    url: https://default.example.example